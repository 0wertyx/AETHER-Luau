name: Build Luau bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate standalone LocalScript
        run: python tools/build.py
      - name: Commit updated bundle if needed
        run: |
          if git diff --quiet -- dist/AETHER.client.luau; then
            echo "Bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AETHER.client.luau
          git commit -m "build: refresh bundled Luau LocalScript"
          git push